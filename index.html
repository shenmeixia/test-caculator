<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>整数在线计算器</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          boxShadow: {
            'calc': '0 20px 50px -15px rgba(15, 23, 42, 0.14), 0 4px 12px -2px rgba(15, 23, 42, 0.06)',
            'calc-dark': '0 24px 60px -15px rgba(0, 0, 0, 0.55), 0 4px 14px -2px rgba(0, 0, 0, 0.35)'
          }
        }
      }
    };
  </script>
</head>
<body class="min-h-screen bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200 flex items-center justify-center p-3 sm:p-6">

  <main class="w-full max-w-4xl mx-auto">
    <!-- Header Bar -->
    <header class="flex flex-wrap items-center justify-between gap-3 mb-4 px-1">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-sm font-bold text-lg select-none" aria-hidden="true">
          ±
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-bold tracking-tight text-slate-900 dark:text-white leading-tight">整数在线计算器</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">支持任意大整数的加、减、乘、除运算与键盘输入</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- Division Mode Toggle -->
        <div class="inline-flex items-center rounded-xl bg-slate-200/80 dark:bg-slate-800/90 p-1 text-xs font-medium" role="group" aria-label="除法结果模式">
          <button id="modeRemainderBtn" type="button" class="px-2.5 py-1.5 rounded-lg transition-colors bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-sm">
            商与余数
          </button>
          <button id="modeDecimalBtn" type="button" class="px-2.5 py-1.5 rounded-lg transition-colors text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200">
            小数结果
          </button>
        </div>

        <!-- Theme Toggle -->
        <button id="themeToggleBtn" type="button" aria-label="切换深浅色主题" title="切换深浅色主题"
          class="w-9 h-9 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 flex items-center justify-center transition-colors shadow-sm">
          <svg id="iconSun" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
          <svg id="iconMoon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Layout Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-5 items-stretch">

      <!-- Calculator Card -->
      <section class="lg:col-span-7 bg-white dark:bg-slate-900 rounded-3xl shadow-calc dark:shadow-calc-dark border border-slate-200/80 dark:border-slate-800 p-4 sm:p-6 flex flex-col justify-between">
        <!-- Display Screen -->
        <div class="relative rounded-2xl bg-slate-50 dark:bg-slate-950/80 border border-slate-200/90 dark:border-slate-800 px-4 sm:px-5 py-4 mb-4 sm:mb-5 min-h-[136px] flex flex-col justify-between">
          <!-- Top Row: Expression + Copy Button -->
          <div class="flex items-start justify-between gap-2 min-h-[24px]">
            <div id="expressionDisplay" class="text-sm sm:text-base text-slate-500 dark:text-slate-400 tabular-nums break-all text-right flex-1 leading-snug" aria-live="polite">
              &nbsp;
            </div>
            <button id="copyBtn" type="button" title="复制结果" aria-label="复制当前结果"
              class="shrink-0 p-1.5 -mt-1 -mr-1 rounded-lg text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-slate-200/60 dark:hover:bg-slate-800 transition-colors">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
          </div>

          <!-- Main Number Display -->
          <div class="mt-2 flex flex-col items-end">
            <div id="mainDisplay" class="w-full text-right font-bold tracking-tight tabular-nums text-4xl sm:text-5xl text-slate-900 dark:text-white break-all leading-tight" aria-live="assertive">
              0
            </div>
            <!-- Remainder / Sub-info Badge -->
            <div id="subDisplay" class="mt-1.5 min-h-[20px] text-xs sm:text-sm font-medium text-indigo-600 dark:text-indigo-400 tabular-nums text-right">
            </div>
          </div>
        </div>

        <!-- Keypad -->
        <div class="grid grid-cols-4 gap-2.5 sm:gap-3" role="group" aria-label="计算器按键">
          <!-- Row 1 -->
          <button type="button" data-action="clear" data-key="Escape"
            class="calc-btn h-14 sm:h-16 rounded-2xl bg-rose-50 dark:bg-rose-950/50 hover:bg-rose-100 dark:hover:bg-rose-900/60 text-rose-600 dark:text-rose-400 font-semibold text-lg border border-rose-200/70 dark:border-rose-900/60">
            <span id="clearBtnLabel">AC</span>
          </button>
          <button type="button" data-action="backspace" data-key="Backspace" aria-label="退格"
            class="calc-btn h-14 sm:h-16 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200/80 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold text-lg flex items-center justify-center border border-slate-200/70 dark:border-slate-700/70">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
              <line x1="18" y1="9" x2="12" y2="15"></line>
              <line x1="12" y1="9" x2="18" y2="15"></line>
            </svg>
          </button>
          <button type="button" data-action="toggle-sign" data-key="±" aria-label="正负号切换"
            class="calc-btn h-14 sm:h-16 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200/80 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold text-xl border border-slate-200/70 dark:border-slate-700/70">
            ±
          </button>
          <button type="button" data-op="/" data-key="/" aria-label="除以"
            class="calc-btn op-btn h-14 sm:h-16 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 hover:bg-indigo-100 dark:hover:bg-indigo-900/70 text-indigo-600 dark:text-indigo-300 font-semibold text-2xl border border-indigo-200/70 dark:border-indigo-800/70">
            ÷
          </button>

          <!-- Row 2 -->
          <button type="button" data-digit="7" data-key="7"
            class="calc-btn h-14 sm:h-16 rounded-2xl bg-slate-50 dark:bg-slate-800/70 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-900 dark:text-white font-semibold text-2xl tabular-nums border border-slate-200/80 dark:border-slate-700/60 shadow-xs">
            7
          </button>
          <button type="button" data-digit="8" data-key="8"
            class="calc-btn h-14 sm:h-16 rounded-2xl bg-slate-50 dark:bg-slate-800/70 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-900 dark:text-white font-semibold text-2xl tabular-nums border border-slate-200/80 dark:border-slate-700/60 shadow-xs">
            8
          </button>
          <button type="button" data-digit="9" data-key="9"
            class="calc-btn h-14 sm:h-16 rounded-2xl bg-slate-50 dark:bg-slate-800/70 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-900 dark:text-white font-semibold text-2xl tabular-nums border border-slate-200/80 dark:border-slate-700/60 shadow-xs">
            9
          </button>
          <button type="button" data-op="*" data-key="*" aria-label="乘以"
            class="calc-btn op-btn h-14 sm:h-16 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 hover:bg-indigo-100 dark:hover:bg-indigo-900/70 text-indigo-600 dark:text-indigo-300 font-semibold text-2xl border border-indigo-200/70 dark:border-indigo-800/70">
            ×
          </button>

          <!-- Row 3 -->
          <button type="button" data-digit="4" data-key="4"
            class="calc-btn h-14 sm:h-16 rounded-2xl bg-slate-50 dark:bg-slate-800/70 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-900 dark:text-white font-semibold text-2xl tabular-nums border border-slate-200/80 dark:border-slate-700/60 shadow-xs">
            4
          </button>
          <button type="button" data-digit="5" data-key="5"
            class="calc-btn h-14 sm:h-16 rounded-2xl bg-slate-50 dark:bg-slate-800/70 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-900 dark:text-white font-semibold text-2xl tabular-nums border border-slate-200/80 dark:border-slate-700/60 shadow-xs">
            5
          </button>
          <button type="button" data-digit="6" data-key="6"
            class="calc-btn h-14 sm:h-16 rounded-2xl bg-slate-50 dark:bg-slate-800/70 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-900 dark:text-white font-semibold text-2xl tabular-nums border border-slate-200/80 dark:border-slate-700/60 shadow-xs">
            6
          </button>
          <button type="button" data-op="-" data-key="-" aria-label="减去"
            class="calc-btn op-btn h-14 sm:h-16 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 hover:bg-indigo-100 dark:hover:bg-indigo-900/70 text-indigo-600 dark:text-indigo-300 font-semibold text-2xl border border-indigo-200/70 dark:border-indigo-800/70">
            −
          </button>

          <!-- Row 4 -->
          <button type="button" data-digit="1" data-key="1"
            class="calc-btn h-14 sm:h-16 rounded-2xl bg-slate-50 dark:bg-slate-800/70 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-900 dark:text-white font-semibold text-2xl tabular-nums border border-slate-200/80 dark:border-slate-700/60 shadow-xs">
            1
          </button>
          <button type="button" data-digit="2" data-key="2"
            class="calc-btn h-14 sm:h-16 rounded-2xl bg-slate-50 dark:bg-slate-800/70 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-900 dark:text-white font-semibold text-2xl tabular-nums border border-slate-200/80 dark:border-slate-700/60 shadow-xs">
            2
          </button>
          <button type="button" data-digit="3" data-key="3"
            class="calc-btn h-14 sm:h-16 rounded-2xl bg-slate-50 dark:bg-slate-800/70 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-900 dark:text-white font-semibold text-2xl tabular-nums border border-slate-200/80 dark:border-slate-700/60 shadow-xs">
            3
          </button>
          <button type="button" data-op="+" data-key="+" aria-label="加上"
            class="calc-btn op-btn h-14 sm:h-16 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 hover:bg-indigo-100 dark:hover:bg-indigo-900/70 text-indigo-600 dark:text-indigo-300 font-semibold text-2xl border border-indigo-200/70 dark:border-indigo-800/70">
            +
          </button>

          <!-- Row 5 -->
          <button type="button" data-digit="0" data-key="0"
            class="calc-btn col-span-2 h-14 sm:h-16 rounded-2xl bg-slate-50 dark:bg-slate-800/70 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-900 dark:text-white font-semibold text-2xl tabular-nums border border-slate-200/80 dark:border-slate-700/60 shadow-xs">
            0
          </button>
          <button type="button" data-digit="00" data-key="00"
            class="calc-btn h-14 sm:h-16 rounded-2xl bg-slate-50 dark:bg-slate-800/70 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 font-semibold text-xl tabular-nums border border-slate-200/80 dark:border-slate-700/60 shadow-xs">
            00
          </button>
          <button type="button" data-action="equals" data-key="Enter" aria-label="等于"
            class="calc-btn h-14 sm:h-16 rounded-2xl bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold text-2xl shadow-md shadow-indigo-600/20">
            =
          </button>
        </div>

        <!-- Keyboard Hint -->
        <p class="mt-4 text-[11px] text-slate-400 dark:text-slate-500 text-center hidden sm:block">
          快捷键：数字键 0-9、+ - * /、Enter 计算、Backspace 退格、Esc 归零、N 切换正负号
        </p>
      </section>

      <!-- History Panel -->
      <aside class="lg:col-span-5 bg-white dark:bg-slate-900 rounded-3xl shadow-calc dark:shadow-calc-dark border border-slate-200/80 dark:border-slate-800 p-4 sm:p-6 flex flex-col max-h-[540px]">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-100 dark:border-slate-800">
          <div class="flex items-center gap-2">
            <h2 class="text-sm font-semibold text-slate-800 dark:text-slate-200">计算历史</h2>
            <span id="historyCount" class="text-xs px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 tabular-nums">0</span>
          </div>
          <button id="clearHistoryBtn" type="button"
            class="text-xs font-medium text-slate-400 hover:text-rose-500 dark:hover:text-rose-400 transition-colors disabled:opacity-40 disabled:pointer-events-none" disabled>
            清空记录
          </button>
        </div>

        <div id="historyList" class="history-scroll flex-1 overflow-y-auto space-y-2 pr-1">
          <!-- Populated dynamically -->
        </div>

        <div id="historyEmpty" class="flex-1 flex flex-col items-center justify-center text-center py-10 px-4">
          <div class="w-11 h-11 rounded-2xl bg-slate-100 dark:bg-slate-800/80 text-slate-400 dark:text-slate-500 flex items-center justify-center mb-3">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </div>
          <p class="text-sm font-medium text-slate-600 dark:text-slate-300">暂无计算记录</p>
          <p class="text-xs text-slate-400 dark:text-slate-500 mt-1">完成计算后会显示在这里，点击任意记录可将结果填入继续计算</p>
        </div>
      </aside>
    </div>
  </main>

  <!-- Toast Notification -->
  <div id="toast" role="status" aria-live="polite"
    class="fixed bottom-5 left-1/2 -translate-x-1/2 px-4 py-2 rounded-xl bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-xs font-medium shadow-lg opacity-0 pointer-events-none transition-opacity duration-200 z-50">
    已复制到剪贴板
  </div>

  <script src="./app.js"></script>
</body>
</html>
